# SecRelay-Relay 的 coturn 模板。改掉带 <...> 的地方即可直接用。
# 与 Rust 服务的对应关系见 docs/部署-coturn.md。

# 对外可达地址（有公网 IP 的机器必须写；写 IP，不要写域名）。
external-ip=<公网 IP>

# 监听地址与端口。UDP/TCP 3478 是标准端口；TLS 用 5349，443 留给反代。
listening-ip=0.0.0.0
listening-port=3478
tls-listening-port=5349
# 让 TURN_URLS 里的 turns:...:5349 有对应监听。
alt-tls-listening-port=5350

# 短期凭据：密钥必须与 Rust 服务的 TURN_SECRET 完全一致、
# realm 必须与 TURN_REALM 完全一致，否则客户端拿着我们签的凭据会被拒。
use-auth-secret
static-auth-secret=<与 TURN_SECRET 相同的随机密钥>
realm=<与 TURN_REALM 相同，如 secrelay.relay>

# 中继分配用的端口段：防火墙要放行这段 UDP（端口数 ≈ 可并发中继会话数上限）。
min-port=49152
max-port=65535

# TLS/DTLS 证书。用真实证书，别自签；路径按实际改。
# 不配证书时只监听明文端口，客户端只能用 turn:（不能 turns: / ?transport=tcp 的 TLS）。
# cert=/etc/letsencrypt/live/relay.example.com/fullchain.pem
# pkey=/etc/letsencrypt/live/relay.example.com/privkey.pem
# dh-file=/etc/ssl/private/dhparam.pem

# 不要开 CLI：它是管理入口，暴露出去等于把中继交出去。
no-cli

# 日志：stdout 交给 systemd，轮转也交给它。
log-file=stdout
simple-log
verbose
no-stdout-log=false

# 单会话带宽上限（字节/秒，0 = 不限）。1400000 ≈ 11 Mbps，够 1080p 中继。
# 注意这是 UDP/TCP 中继层面的限速，不是我们的每 IP 配额。
max-bps=1400000

# 禁用多播地址，避免被当成放大反射器。
no-multicast-peers
